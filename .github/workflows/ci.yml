name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the workspace (the web crate builds for wasm and is covered by the web job)
        run: cargo test --workspace --exclude apricity-web

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The beat, chords and melody tests load the real engine. Built as Amplify builds it (the rust-toolchain.toml
      # channel and this platform's wasi-sdk), into target/ where the tests look.
      - name: Build the wasm module
        run: RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" CARGO_TARGET_DIR="$PWD/target" sh scripts/amplify-wasm.sh
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Flow tests
        run: npm run test:flow
        working-directory: web
      - name: Contract is up to date
        run: npm run contract:check
        working-directory: web
      - name: Build the production frontend
        run: |
          npm run build
          cp .cache/apricity_web.wasm dist/apricity_web.wasm
          # Manual Amplify deployments read this from the artifact root.
          cp ../customHttp.yml dist/customHttp.yml
        working-directory: web
      - name: Upload the tested production frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: apricity-static-site
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  features:
    name: Gherkin step vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node features/data/check-steps.mjs
