name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the workspace (the web crate builds for wasm and is covered by the web job)
        run: cargo test --workspace --exclude apricity-web

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The beat, chords and melody tests load the real engine. Built as Amplify builds it (the rust-toolchain.toml
      # channel and this platform's wasi-sdk), into target/ where the tests look.
      - name: Build the wasm module
        run: RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" CARGO_TARGET_DIR="$PWD/target" sh scripts/amplify-wasm.sh
      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web
      - name: Type-check Amplify backend
        run: npx tsc --noEmit --project amplify/tsconfig.json
        working-directory: web
      - name: Semantic TypeScript tests
        run: npm run test:semantic
        working-directory: web
      - name: Flow tests
        run: npm run test:flow
        working-directory: web
      - name: Contract is up to date
        run: npm run contract:check
        working-directory: web
      - name: Build the production frontend
        run: |
          npm run build
          cp .cache/apricity_web.wasm dist/apricity_web.wasm
        working-directory: web

  features:
    name: Gherkin step vocabulary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node features/data/check-steps.mjs

  semantic-ground:
    name: Semantic ground contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semantic ground contract tests
        run: |
          semantic_venv="$(mktemp -d)/venv"
          python -m venv "$semantic_venv"
          "$semantic_venv/bin/python" -m pip install -r analysis/requirements-semantic-tests.txt
          PYTHONPATH=analysis "$semantic_venv/bin/python" -m pytest \
            analysis/tests/test_semantic_contract.py \
            analysis/tests/test_semantic_freshness.py \
            analysis/tests/test_semantic_records.py \
            analysis/tests/test_semantic_publisher.py \
            analysis/tests/test_semantic_backfill.py \
            analysis/tests/test_semantic_catalog.py \
            analysis/tests/test_semantic_evaluation.py \
            analysis/tests/test_cluster_corpus.py \
            analysis/tests/test_audio_clusters.py \
            analysis/tests/test_cluster_summaries.py \
            analysis/tests/test_cluster_runs.py \
            analysis/tests/test_cluster_jobs.py \
            analysis/tests/test_cluster_publication.py \
            analysis/tests/test_semantic_ci.py
