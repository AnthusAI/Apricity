[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"

[workspace.dependencies]
apricitus-dsp = { path = "crates/apricitus-dsp" }
apricitus-theory = { path = "crates/apricitus-theory" }
apricitus-score = { path = "crates/apricitus-score" }
apricitus-engine = { path = "crates/apricitus-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
