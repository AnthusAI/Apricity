[project]
name = "apricity-analyze"
version = "0.1.0"
description = "Offline clip analysis for Apricity: beats, warp markers, key, tuning, chroma, notes -> <clip>.apricity.json"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "essentia==2.1b6.dev1389",
  "torch",
  "soundfile",
  "soxr",
  "einops",
  "rotary-embedding-torch",
  "beat_this @ https://github.com/CPJKU/beat_this/archive/main.zip",
  # basic-pitch's own pins want tensorflow-macos (absent for py3.12). We run its ONNX model,
  # so install it with `pip install --no-deps basic-pitch==0.4.0` plus these:
  "onnxruntime",
  "librosa",
  "pretty_midi",
  "resampy",
  "mir_eval",
  "scipy",
  "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest"]
# Noise reduction (scripts/catalog-add-loc.py denoises by default). Install `denoiser` with
# `pip install --no-deps denoiser`: its hydra/omegaconf pins are not needed to run the pretrained model.
denoise = ["noisereduce"]
# CLAP audio/text embeddings (scripts/fit-features.py, apricity_analyze/clap.py). Checkpoint
# (laion/clap-htsat-unfused, ~620 MB; see clap.py for why not the music one) downloads to the HF cache on first use, not at install time.
clap = ["transformers"]
# M4 deterministic ground clustering.  These are exact pins validated against the
# analysis environment. Keep clustering dependencies pinned so manifests and
# repeated runs identify the same numerical implementation.
clustering = [
  "umap-learn==0.5.12",
  "hdbscan==0.8.44",
  "numpy==2.2.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "numba==0.67.0",
  "pynndescent==0.6.0",
]

[project.scripts]
apricity-analyze = "apricity_analyze.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apricity_analyze"]
