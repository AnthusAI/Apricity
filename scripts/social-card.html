<!doctype html>
<!-- The social preview card (1200×630). scripts/social-card.mjs fills the image below with a capture of a score's Flow panel. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background:
          radial-gradient(900px 420px at 18% -8%, rgba(255, 168, 102, 0.28), transparent 70%),
          radial-gradient(700px 380px at 100% 0%, rgba(217, 130, 200, 0.16), transparent 70%),
          #140e14;
        color: #f6ece2;
        font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      .text { position: absolute; left: 64px; top: 44px; right: 64px; }
      .eyebrow { font-size: 15px; letter-spacing: 0.24em; text-transform: uppercase; color: #b8a397; }
      h1 {
        margin: 8px 0 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-weight: 500; font-size: 96px; line-height: 1.05; letter-spacing: -0.02em;
        background: linear-gradient(100deg, #ff7a5c 0%, #ffa866 40%, #ffd59a 70%, #ffa866 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        display: inline-block; padding-bottom: 6px;
      }
      p { position: absolute; left: 470px; top: 72px; right: 0; margin: 0; font-size: 26px; line-height: 1.35; color: #e9dccf; }
      p em { font-style: normal; color: #ffa866; }
      .flow {
        position: absolute; left: 40px; right: 40px; top: 214px; bottom: -24px;
        border-radius: 16px; overflow: hidden;
        border: 1px solid rgba(255, 230, 205, 0.14);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 0, 0, 0.4);
        background: #1b141b;
      }
      .flow img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
      .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: linear-gradient(transparent, #140e14); }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="eyebrow">The social mashup machine</div>
      <h1>Apricity</h1>
      <p>A <em>collaborative, social</em> instrument: make music from real recordings, <em>share it</em>, and <em>build on each other’s</em>. Every sound is <em>cleared</em>.</p>
    </div>
    <div class="flow"><img src="FLOW_PNG" alt="" /></div>
    <div class="fade"></div>
  </body>
</html>
