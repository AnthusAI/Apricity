version: 1
applications:
  - appRoot: web
    backend:
      phases:
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - ../scripts/amplify-wasm.sh
        build:
          commands:
            - npm run build
            - cp .cache/apricity_web.wasm dist/apricity_web.wasm
            - cp amplify_outputs.json dist/amplify_outputs.json
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - .cache/cargo/registry/**/*
          - .cache/rustup/**/*
          - .cache/target/**/*
