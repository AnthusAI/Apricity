enum ClipSource {
  user
  ml
  curated
}

enum Kind {
  loop
  break
  hit
  phrase
  section
  chop
  other
}

enum VerdictValue {
  keep
  skip
  later
}

enum ScoreKind {
  song
  beat
  chords
  melody
}

enum RatingTarget {
  sample
  clip
  score
}

type Recording @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  title: String!
  collection: String! @index(sortKeyFields: ["title"], queryField: "recordingsByCollection")
  performer: String
  composed: Int
  recorded: String
  credit: String
  rights: String
  sourcePage: AWSURL
  url: AWSURL
  license: String
  licenseUrl: AWSURL
  author: String
  attribution: String
  documents: [FileRef]
  samples: [Sample] @hasMany(references: ["recordingId"])
}

type Sample @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  recordingId: ID! @index(sortKeyFields: ["path"], queryField: "samplesByRecording")
  recording: Recording @belongsTo(references: ["recordingId"])
  path: String! @index(queryField: "samplesByPath")
  aliases: [String]
  collection: String! @index(sortKeyFields: ["path"], queryField: "samplesByCollection")
  title: String!
  role: SampleRole
  stem: String
  stemModel: String
  parentSampleId: ID @index(queryField: "samplesByParent")
  excerptStart: Float
  audio: FileRef!
  analysis: FileRef
  analysisVersion: Int
  analyzedAt: AWSDateTime
  status: SampleStatus
  duration: Float
  sampleRate: Int
  channels: Int
  bpm: Float
  bpmStability: Float
  meter: Int
  key: String
  camelot: String
  keysOverTime: [String]
  tuningCents: Float
  noteCount: Int
  tags: [String]
  nameCounters: AWSJSON
  clips: [Clip] @hasMany(references: ["sampleId"])
  markers: [Marker] @hasMany(references: ["sampleId"])
  candidates: [Candidate] @hasMany(references: ["sampleId"])
}

type Clip @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  sampleId: ID! @index(sortKeyFields: ["start"], queryField: "clipsBySample") @index(sortKeyFields: ["name"], queryField: "clipsBySampleAndName")
  sample: Sample @belongsTo(references: ["sampleId"])
  name: String!
  start: Float!
  end: Float!
  source: ClipSource!
  kind: Kind
  tags: [String]
  evidence: AWSJSON
  rank: Int
  candidateId: ID @index(queryField: "clipsByCandidate")
  retired: Boolean
  owner: String
  copyOf: ID @index(queryField: "clipsByCopyOf")
}

type Marker @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  sampleId: ID! @index(sortKeyFields: ["seconds"], queryField: "markersBySample")
  sample: Sample @belongsTo(references: ["sampleId"])
  name: String!
  seconds: Float!
  source: ClipSource
  note: String
  owner: String
}

type Candidate @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  sampleId: ID! @index(sortKeyFields: ["start"], queryField: "candidatesBySample")
  sample: Sample @belongsTo(references: ["sampleId"])
  recordingId: ID! @index(sortKeyFields: ["baseScore"], queryField: "candidatesByRecording")
  start: Float!
  end: Float!
  kind: Kind! @index(sortKeyFields: ["baseScore"], queryField: "candidatesByKind")
  name: String
  context: CandidateContext
  proposers: [Proposer]!
  baseScore: Float!
  legacyId: String
  verdicts: [Verdict] @hasMany(references: ["candidateId"])
}

type Verdict @model @auth(rules: [{allow: owner, ownerField: "judge", identityClaim: "sub"},
  {allow: groups, operations: [read], groups: ["admins"]}])
{
  candidateId: ID! @primaryKey(sortKeyFields: ["judge"])
  judge: String! @index(sortKeyFields: ["judgedAt"], queryField: "verdictsByJudge")
  candidate: Candidate @belongsTo(references: ["candidateId"])
  verdict: VerdictValue!
  stars: Int
  tags: [String]
  name: String
  judgedAt: AWSDateTime!
  by: String
}

type Crate @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["members"]}])
{
  id: ID! @primaryKey
  name: String!
  note: String
  owner: String @index(sortKeyFields: ["name"], queryField: "cratesByOwner")
  items: [CrateItem] @hasMany(references: ["crateId"])
}

type CrateItem @model @auth(rules: [{allow: owner, ownerField: "owner"},
  {allow: groups, operations: [read], groups: ["members"]}])
{
  id: ID! @primaryKey
  crateId: ID! @index(sortKeyFields: ["position"], queryField: "crateItemsByCrate")
  crate: Crate @belongsTo(references: ["crateId"])
  position: String!
  candidateId: ID @index(queryField: "crateItemsByCandidate")
  clipId: ID
  sampleId: ID
  note: String
  owner: String
}

type Score @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  title: String!
  folder: String! @index(sortKeyFields: ["title"], queryField: "scoresByFolder")
  format: ScoreFormat
  kind: ScoreKind @index(queryField: "scoresByKind")
  tags: [String]
  text: String!
  lastErrors: [String]
  legacyPath: String
  owner: String
  forkOf: ID @index(queryField: "scoresByForkOf")
  forkRoot: ID
  refs: [ScoreRef] @hasMany(references: ["scoreId"])
}

type ScoreRef @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  scoreId: ID! @index(queryField: "refsByScore")
  score: Score @belongsTo(references: ["scoreId"])
  clipAlias: String!
  sampleId: ID @index(sortKeyFields: ["scoreId"], queryField: "refsBySample")
  samplePath: String
  clipName: String
  clipId: ID @index(queryField: "refsByClip")
  start: Float
  end: Float
  owner: String
}

type Rating @model @auth(rules: [{allow: owner, ownerField: "owner"}])
{
  id: ID! @primaryKey
  targetType: RatingTarget!
  targetId: ID!
  stars: Int!
  ratedAt: AWSDateTime!
  owner: String
}

type Comment @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  targetType: RatingTarget!
  targetId: ID! @index(sortKeyFields: ["createdAt"], queryField: "commentsByTarget")
  parentId: ID
  body: String!
  deleted: Boolean
  owner: String
  createdAt: AWSDateTime
}

type Activity @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]}])
{
  id: ID! @primaryKey
  feed: String! @index(sortKeyFields: ["lastAt"], queryField: "activityByFeed")
  targetType: RatingTarget!
  targetId: ID!
  title: String
  kind: String
  owner: String
  samplePath: String
  lastAt: AWSDateTime!
  lastWhat: String
  lastBy: String
  comments: Int
  ratings: Int
  forks: Int
}

type ActivityEvent @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]}])
{
  id: ID! @primaryKey
  targetKey: String! @index(sortKeyFields: ["at"], queryField: "eventsByTarget")
  at: AWSDateTime!
  what: String!
  by: String
  stars: Int
  commentId: ID
  otherId: ID
  otherTitle: String
}

type Handle @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: owner, operations: [create, read, delete], ownerField: "owner"},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  owner: String @index(queryField: "handlesByOwner")
}

type Tally @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]}])
{
  id: ID! @primaryKey
  targetType: RatingTarget! @index(sortKeyFields: ["day"], queryField: "talliesByTypeAndDay")
  targetId: ID!
  day: String!
  count: Int!
  sum: Int!
}

type Job @model @auth(rules: [{allow: public, provider: identityPool, operations: [read]},
  {allow: private, operations: [read]},
  {allow: groups, groups: ["curators"]}])
{
  id: ID! @primaryKey
  kind: String!
  sampleId: ID
  state: JobState @index(queryField: "jobsByState")
  error: String
}

type FileRef 
{
  key: String!
  sha256: String!
  size: Int
  contentType: String
}

type Proposer 
{
  by: String!
  score: Float!
  why: String!
  evidence: AWSJSON
  at: AWSDateTime!
}

type CandidateContext 
{
  seconds: Float
  bpm: Float
  beats: Float
  key: String
  stem: String
}

enum SampleRole {
  source
  stem
  excerpt
  upload
}

enum SampleStatus {
  pending
  analyzing
  ready
  failed
}

enum ScoreFormat {
  apr
  yaml
}

enum JobState {
  queued
  running
  done
  failed
}
