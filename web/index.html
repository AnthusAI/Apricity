<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apricity</title>
    <meta name="description" content="A collaborative, social instrument made of samples: make beats, chords and melodies from real recordings, share them, and build on each other's. Every sound is cleared." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Apricity" />
    <meta property="og:url" content="https://apricity.anth.us/" />
    <meta property="og:title" content="Apricity: the social mashup machine" />
    <meta property="og:description" content="Make beats, chords and melodies from real recordings, share them, and build on each other's. Every sound is cleared, with its provenance and credits." />
    <meta property="og:image" content="https://apricity.anth.us/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Apricity's Flow view: recordings at the top, the clips cut from them, and ribbons to every place a clip plays in the score." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Apricity: the social mashup machine" />
    <meta name="twitter:description" content="Make music from real recordings, share it, and build on each other's. Every sound is cleared." />
    <meta name="twitter:image" content="https://apricity.anth.us/social-card.png" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%233a6df0'/><circle cx='16' cy='16' r='10' fill='none' stroke='%233a6df0' stroke-width='2' opacity='.6'/><circle cx='16' cy='16' r='15' fill='none' stroke='%233a6df0' stroke-width='1.5' opacity='.3'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand link" href="/" data-tab="home" title="Home"><span class="logo" aria-hidden="true"></span>Apricity</a>
      <nav class="tabs" role="tablist">
        <a role="tab" href="/scores" data-tab="scores" aria-selected="true">Scores</a>
        <a role="tab" href="/beats" data-tab="beats" aria-selected="false">Beats</a>
        <a role="tab" href="/chords" data-tab="chords" aria-selected="false">Chords</a>
        <a role="tab" href="/melodies" data-tab="melodies" aria-selected="false">Melodies</a>
        <a role="tab" href="/clips" data-tab="clips" aria-selected="false">Clips</a>
        <a role="tab" href="/samples" data-tab="samples" aria-selected="false">Samples</a>
        <a role="tab" href="/sounds" data-tab="sounds" aria-selected="false">Sounds</a>
        <a role="tab" href="/help" data-tab="docs" aria-selected="false">Help</a>
      </nav>
      <div class="transport" id="transport"></div>
      <div class="top-search-host" id="top-search"></div>
      <div class="account" id="account" hidden></div>
    </header>
    <main>
      <section id="home" class="view" data-view="home" hidden></section>
      <section id="about" class="view" data-view="about" hidden></section>
      <section id="how-it-works" class="view" data-view="how-it-works" hidden></section>
      <section id="listen" class="view" data-view="listen" hidden></section>
      <section id="labs" class="view" data-view="labs" hidden></section>
      <section id="section" class="view" data-view="section" hidden></section>
      <section id="search" class="view" data-view="search" hidden></section>
      <section id="tags" class="view" data-view="tags" hidden></section>
      <!-- Scores, Beats, Chords and Melodies are one view: a score of that kind. -->
      <section id="score" class="view" data-view="score"></section>
      <section id="clips" class="view library" data-view="clips" hidden></section>
      <section id="samples" class="view library" data-view="samples" hidden></section>
      <section id="sounds" class="view" data-view="sounds" hidden></section>
      <section id="docs" class="view" data-view="docs" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
