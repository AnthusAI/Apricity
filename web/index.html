<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apricity</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%233a6df0'/><circle cx='16' cy='16' r='10' fill='none' stroke='%233a6df0' stroke-width='2' opacity='.6'/><circle cx='16' cy='16' r='15' fill='none' stroke='%233a6df0' stroke-width='1.5' opacity='.3'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <button class="brand link" type="button" data-tab="home" title="Home"><span class="logo" aria-hidden="true"></span>Apricity</button>
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="scores" aria-selected="true">Scores</button>
        <button role="tab" data-tab="beats" aria-selected="false">Beats</button>
        <button role="tab" data-tab="chords" aria-selected="false">Chords</button>
        <button role="tab" data-tab="melodies" aria-selected="false">Melodies</button>
        <button role="tab" data-tab="clips" aria-selected="false">Clips</button>
        <button role="tab" data-tab="samples" aria-selected="false">Samples</button>
        <button role="tab" data-tab="docs" aria-selected="false">Help</button>
      </nav>
      <div class="transport" id="transport"></div>
    </header>
    <div class="account" id="account" hidden></div>
    <main>
      <section id="home" class="view" data-view="home" hidden></section>
      <!-- Scores, Beats, Chords and Melodies are one view: a score of that kind. -->
      <section id="score" class="view" data-view="score"></section>
      <section id="clips" class="view library" data-view="clips" hidden></section>
      <section id="samples" class="view library" data-view="samples" hidden></section>
      <section id="docs" class="view" data-view="docs" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
