customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Cross-Origin-Embedder-Policy'
        value: 'require-corp'
      - key: 'Cross-Origin-Resource-Policy'
        value: 'same-origin'
  - pattern: '/apricity_web.wasm'
    headers:
      - key: 'Content-Type'
        value: 'application/wasm'
