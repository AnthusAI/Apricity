[package]
name = "apricity-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apricity domain logic: pure functions for ids, ranking, and markup merge."

[dependencies]
apricity-score.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
virtuus-amplify = { path = "../../../Virtuus/rust/crates/virtuus-amplify" }
chrono = "0.4"
thiserror = "1"
aws-config = "1"
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
