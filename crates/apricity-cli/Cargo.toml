[package]
name = "apricity-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `apricity` command: compile, explain and render scores."

[[bin]]
name = "apricity"
path = "src/main.rs"

[dependencies]
apricity-data.workspace = true
apricity-dsp.workspace = true
apricity-engine = { workspace = true, features = ["decode"] }
apricity-score.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
hound = "3"

[dev-dependencies]
tempfile = "3"
