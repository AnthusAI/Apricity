[package]
name = "apricity-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `apricity` command: compile, explain and render scores."

[[bin]]
name = "apricity"
path = "src/main.rs"

[dependencies]
apricity-data.workspace = true
apricity-dsp.workspace = true
apricity-engine = { workspace = true, features = ["decode"] }
apricity-score.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
hound = "3"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs"] }
virtuus-amplify = { path = "../../../Virtuus/rust/crates/virtuus-amplify" }
virtuus-appsync = { path = "../../../Virtuus/rust/crates/virtuus-appsync" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
