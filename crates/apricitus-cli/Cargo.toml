[package]
name = "apricitus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `apricitus` command: compile, explain and render scores."

[[bin]]
name = "apricitus"
path = "src/main.rs"

[dependencies]
apricitus-dsp.workspace = true
apricitus-engine = { workspace = true, features = ["decode"] }
apricitus-score.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
hound = "3"
